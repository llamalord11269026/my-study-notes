<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的主題式學習筆記庫</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <h1>📚 主題式學習筆記庫</h1>
      <p>透過系統化結構整理核心知識，由 AGENTS.md 規範驅動持續更新</p>
    </header>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">全部筆記</button>
      <button class="filter-btn" data-filter="生物化學">生物化學</button>
      <button class="filter-btn" data-filter="AI 工具">AI 工具</button>
      <button class="filter-btn" data-filter="工作流">工作流</button>
    </div>
    <main class="notes-grid">
      <a href="notes/note-02.html" class="note-card" data-category="生物化學">
        <div>
          <span class="tag">生物化學</span>
          <h2>生物化學核心概念：從四大生物巨分子到能量代謝</h2>
          <p>理解細胞如何透過四大生物巨分子建構結構，並利用酵素催化與 ATP 能量轉換維持生命運作。</p>
        </div>
        <time>2026-11-17</time>
      </a>
      <a href="notes/note-01.html" class="note-card" data-category="AI 工具">
        <div>
          <span class="tag">AI 工具</span>
          <h2>為什麼我們需要 AGENTS.md？從單次對話到專案協作</h2>
          <p>理解 Vibe Coding 與結構化專案規則的差異，學會如何為 AI 撰寫清楚的開發說明書。</p>
        </div>
        <time>2026-11-17</time>
      </a>
    </main>
    <footer>
      <p>Built with AGENTS.md & GitHub Pages</p>
    </footer>
  </div>
  <script>
    const buttons = document.querySelectorAll('.filter-btn');
    const cards = document.querySelectorAll('.note-card');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        cards.forEach(card => {
          card.style.display = (filter === 'all' || card.dataset.category === filter) ? 'flex' : 'none';
        });
      });
    });
  </script>
</body>
</html>
